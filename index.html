function rescheduleAbcReview(oldDateStr, oldSlotKey){
  const newDate = document.getElementById('abc-resched-date').value;
  const newTime = document.getElementById('abc-resched-time').value;
  if(!newDate || !newTime){ showNotice('Missing Info', 'Pick both a date and a time.'); return; }
  const parts = newTime.split(':').map(Number);
  let snapH = parts[0], snapM = Math.round((parts[1]||0)/15)*15;
  if(snapM===60){ snapM=0; snapH++; }
  const oldD = ensureDaily(oldDateStr);
  Object.keys(oldD.slots).forEach(k=>{
    if(k===oldSlotKey || (oldD.slots[k] && oldD.slots[k].occupiedBy===oldSlotKey)) delete oldD.slots[k];
  });
  writeSpanBlock(newDate, 'q'+snapH+'_'+snapM, 180, {customText:'ABC Review', source:'abcreview'});
  saveState(); closeModal(); renderDaily();
  showToast('ABC Review rescheduled to '+fmtDMY(newDate));
}

function seedDailyDefaults(dateStr){
  const d = ensureDaily(dateStr);
  const dayIdx = new Date(dateStr+'T00:00:00').getDay();
  const addDefault = (h,m,minutes,name)=>{
    const keys = spanKeysFrom(h,m,minutes);
    if(keys.length===0) return;
    const startKey = keys[0];
    if(!d.slots[startKey]){
      d.slots[startKey] = {customText:name, completed:false, span:keys.length, source:'default'};
      keys.slice(1).forEach(k=>{ if(!d.slots[k]) d.slots[k] = {occupiedBy:startKey}; });
    }
  };
  // decisive one-time rebuild: wipe the ENTIRE weekend fixed-block time ranges outright
  // (regardless of what's currently sitting in them — correct, wrong, or orphaned leftovers
  // from earlier versions) so nothing stale can survive and create gaps, then reseed fresh.
  if((dayIdx===0 || dayIdx===6) && !d.weekendFullyRebuilt){
    d.weekendFullyRebuilt = true;
    const wipeRanges = dayIdx===0
      ? [[4,0,180],[11,0,480]]   // Lordsday: Morning Routine 04:00–07:00, then 11:00–19:00 entirely
      : [[4,0,180],[11,0,120]];  // Saturday: Morning Routine 04:00–07:00, Meeting 11:00–13:00
    wipeRanges.forEach(([h,m,minutes])=>{
      spanKeysFrom(h,m,minutes).forEach(k=>{ delete d.slots[k]; });
    });
    d.defaultsSeeded = false;
    d.lunchSeeded = true; // weekends never get Lunch, nothing to backfill
  }
  if(!d.defaultsSeeded){
    d.defaultsSeeded = true;
    if(dayIdx===0){ // Lordsday — matches Weekly Schedule exactly
      addDefault(4,0,180,'Morning Routine');       // 04:00–07:00
      // split across the AM/PM column boundary (12:00/13:00) since they're separate grids —
      // one continuous 11:00–19:00 block can't visually span across two different containers
      addDefault(11,0,120,'MEETING / DINNER');     // 11:00–13:00 (AM column)
      addDefault(13,0,360,'MEETING / DINNER');     // 13:00–19:00 (PM column)
    } else if(dayIdx===6){ // Saturday — matches Weekly Schedule exactly
      addDefault(4,0,180,'Morning Routine');       // 04:00–07:00
      addDefault(11,0,120,'MEETING');              // 11:00–13:00
    } else { // weekdays
      addDefault(4,0,150,'Morning Routine');       // 04:00–06:30
      addDefault(17,0,75,'Travel / Workout');      // 17:00–18:15
      addDefault(18,15,30,'Dinner');                // 18:15–18:45
      if(dayIdx!==4){ addDefault(18,45,75,'Meeting'); } // 18:45–20:00, no meeting Thursday
    }
  }
  // Lunch was added after some days were already seeded — backfill it independently so it's never missed
  if(!d.lunchSeeded){
    d.lunchSeeded = true;
    if(dayIdx>=1 && dayIdx<=5) addDefault(12,30,30,'Lunch'); // weekdays only — matches Weekly Schedule
  }
}

function renderDailyColumn(dateStr, dayIdx, startH, endH){
  const dObj = ensureDaily(dateStr);
  const now = new Date();
  const isToday = dateStr === todayISO();
  const fieldLedgerActive = (startH<=20 && endH>=20 && (dObj.fieldLedgerEveningItems||[]).length>0);
  const qs = [];
  for(let h=startH; h<=endH; h++){
    if(h===20 && fieldLedgerActive){ [0,10,20,30,40,50].forEach(m=>{ qs.push({h,m}); }); }
    else { [0,15,30,45].forEach(m=>{ qs.push({h,m}); }); }
  }
  // catbar shows only the Hack Work / Proactive Work windows (role categories live on the Weekly Schedule page only)
  const groups = [];
  qs.forEach((q,idx)=>{
    const wt = getWorkTypeConstraint(q.h, q.m) || '';
    if(groups.length && groups[groups.length-1].wt===wt){
      groups[groups.length-1].count++;
    } else {
      groups.push({wt, start:idx, count:1});
    }
  });

  let inner = '';
  groups.forEach(g=>{
    const barClass = g.wt ? 'catbar-wt-'+g.wt.toLowerCase() : 'cat-blank';
    inner += `<div class="catbar-block ${barClass}" style="grid-row:${g.start+1} / span ${g.count};grid-column:1;">
      ${g.wt ? `<span class="catlabel">${WT_LABEL[g.wt]}</span>` : ''}
    </div>`;
  });

  qs.forEach((q,idx)=>{
    const slotKey = 'q'+q.h+'_'+q.m;
    const timeLabel = fmtHM(q.h,q.m);
    const slotStart = new Date(dateStr+'T00:00:00'); slotStart.setHours(q.h,q.m,0,0);
    const slotDurationMin = (q.h===20 && fieldLedgerActive) ? 10 : 15;
    const slotEnd = new Date(slotStart.getTime()+slotDurationMin*60000);
    let timeClass='time-cell';
    if(isToday){
      if(now>=slotStart && now<slotEnd) timeClass+=' current';
      else if(now>=slotEnd) timeClass+=' past';
    }
    inner += `<div class="${timeClass}" style="grid-row:${idx+1} / span 1;grid-column:2;">${timeLabel}</div>`;

    // Field Ledger evening items (20:00–21:00): rendered as one combined block spanning
    // all 6 of the hour's 10-min rows (each at full row height), with items positioned
    // by exact minute inside it — so a 5-min item only ever needs splitting in half,
    // not into thirds, keeping text and buttons legible.
    if(q.h===20 && fieldLedgerActive){
      if(q.m===0){
        inner += renderFieldLedgerHourBlock(dateStr, idx, dObj.fieldLedgerEveningItems);
      }
      return;
    }

    const slot = dObj.slots[slotKey];
    if(slot && slot.occupiedBy){
      // covered by a spanning task box rendered from its own start row; render nothing here
      return;
    }
    if(slot && slot.isMulti){
      inner += renderMultiSlot(dateStr, idx, slotKey, slot);
      return;
    }
    const span = slot && slot.span ? Math.min(slot.span, qs.length-idx) : 1;
    let rowClass = 'task-box';
    if(slot && slot.source==='outlook') rowClass += (slot.outlookMeeting ? ' outlook-meeting' : ' outlook-src');
    if(slot && slot.source==='fieldledger') rowClass += ' fieldledger-src';
    if(slot && slot.source==='abcreview') rowClass += ' abcreview-src';
    if(slot && slot.critical) rowClass += ' urgent-box';
    if(slot && slot.source==='default') rowClass += ' fixed-frozen';
    if(slot && slot.source==='weeklygoal'){
      rowClass += ' weeklygoal-src';
    } else if(slot && slot.taskId){
      const task = state.tasks.find(t=>t.id===slot.taskId) || state.archive.find(t=>t.id===slot.taskId);
      if(task) rowClass += ' pri-'+computePriority(task);
    }
    if(isToday && slot){
      const blockEnd = new Date(slotStart.getTime()+span*slotDurationMin*60000);
      if(now>=blockEnd && !slot.completed) rowClass+=' overdue';
      else if(now>=slotStart && now<blockEnd) rowClass+=' current';
      else if(now>=blockEnd) rowClass+=' past';
    }
    if(slot && slot.completed) rowClass += ' slot-done';
    inner += `<div class="${rowClass}" data-slotkey="${slotKey}" data-datestr="${dateStr}" style="grid-row:${idx+1} / span ${span};grid-column:3;">${renderTaskBoxInner(dateStr, slotKey, slot, span)}</div>`;
  });

  let progressBarHtml = '';
  if(startH===4 || startH===13){
    let total=0, done=0;
    qs.forEach(q=>{
      const slotKey='q'+q.h+'_'+q.m;
      const slot = dObj.slots[slotKey];
      if(!slot || slot.occupiedBy) return;
      if(slot.isMulti){
        slot.subItems.forEach(sub=>{ total++; if(sub.completed) done++; });
        return;
      }
      if(!(slot.taskId||slot.customText||slot.critical)) return;
      if(slot.source==='default' || slot.noDone) return; // fixed blocks have no Done button, don't count them
      total++;
      if(slot.completed) done++;
    });
    if(startH===13){
      (dObj.fieldLedgerEveningItems||[]).forEach(item=>{
        total++;
        if(item.completed) done++;
      });
    }
    const pct = total ? Math.round(done/total*100) : 0;
    const label = startH===4 ? 'AM Completion' : 'PM Completion';
    progressBarHtml = `<div class="half-day-progress">
      <div class="half-day-progress-label">${label}</div>
      <div class="half-day-progress-track"><div class="half-day-progress-fill" style="width:${pct}%;background:${pct>=100?'#3ddc5a':completionColor(pct)};"></div></div>
      <div class="half-day-progress-pct${pct>=100?' pct-complete':''}">${done}/${total} · ${pct}%</div>
    </div>`;
  }

  return `<div class="daily-col">
    <div class="daily-col-titlebar">
      <div></div><div>Time</div><div>Task</div>
    </div>
    <div class="daily-col-inner" style="display:grid;grid-template-columns:22px 66px 1fr;grid-auto-rows:30px;">${inner}</div>
    ${progressBarHtml}
  </div>`;
}

function renderFieldLedgerHourBlock(dateStr, startIdx, items){
  const pxPerMin = 3; // 180px container (6 x 30px rows) / 60 minutes -- full row height per 10-min unit
  const containerHeight = 60*pxPerMin;
  let boxesHtml = '';
  items.slice().sort((a,b)=>a.startMin-b.startMin).forEach(item=>{
    const top = item.startMin*pxPerMin;
    const height = Math.max(10, item.duration*pxPerMin);
    const doneClass = item.completed ? ' slot-done' : '';
    boxesHtml += `<div class="task-box fieldledger-src${doneClass}" style="position:absolute;top:${top}px;height:${height}px;left:0;right:0;margin:0 5px;box-sizing:border-box;">
      <div class="tb-main" style="cursor:default;">
        <div class="tb-main-row"><div class="tname" title="${escAttr(item.text)}">${escHtml(item.text)}</div></div>
      </div>
      <div class="tb-actions">
        <div class="done-strip ${item.completed?'is-done':''}" onclick="toggleFieldLedgerItem('${dateStr}','${item.id}')">${item.completed?'Undo':'Done'}</div>
        <button class="del-btn" onclick="deleteFieldLedgerItem('${dateStr}','${item.id}')">✕</button>
      </div>
    </div>`;
  });
  return `<div style="grid-row:${startIdx+1} / span 6;grid-column:3;position:relative;height:${containerHeight}px;">${boxesHtml}</div>`;
}

function renderTaskBoxInner(dateStr, slotKey, slot, span){
  let sq = '';
  let taskHtml = `<div class="empty-hint">click to assign</div>`;
  let fullName = '';
  if(slot){
    if(slot.critical){
      fullName = slot.name;
      const urgentLabel = (slot.span && slot.span===1) ? '' : `<div class="tb-main-row"><span class="urgent-label">URGENT</span></div>`;
      taskHtml = `${urgentLabel}<div class="tb-main-row"><div class="tname" title="${escAttr(slot.name)}">${escHtml(slot.name)}</div></div>`;
    } else if(slot.taskId || slot.customText){
      const task = slot.taskId ? (state.tasks.find(t=>t.id===slot.taskId) || state.archive.find(t=>t.id===slot.taskId)) : null;
      const name = task ? task.name : slot.customText;
      fullName = name;
      const pri = task ? computePriority(task) : null;
      sq = pri ? `<div class="prio-letter ${slot.source==='weeklygoal' ? 'pri-white' : 'pri-'+pri}">${pri}</div>` : '';
      taskHtml = `<div class="tb-main-row">${sq}<div class="tname" title="${escAttr(name)}">${escHtml(name)}</div></div>`;
    }
  }
  const completed = slot && slot.completed;
  const hasContent = slot && (slot.taskId || slot.customText || slot.critical);
  const isLocked = slot && slot.source==='weeklygoal';
  const noDone = slot && (slot.source==='default' || slot.noDone);
  const dragAttr = hasContent ? `onpointerdown="startTaskDrag(event,'${dateStr}','${slotKey}')"` : '';
  const mainDiv = `<div class="tb-main" ${dragAttr} onclick="if(window._justDragged)return;openSlotAssign('${dateStr}','${slotKey}')">${taskHtml}</div>`;
  const isAbcReview = slot && slot.source==='abcreview';
  const delAction = isAbcReview ? `confirmDeleteAbcReview(event,'${dateStr}','${slotKey}')` : `clearSlot(event,'${dateStr}','${slotKey}')`;
  const actionsDiv = hasContent ? `<div class="tb-actions ${noDone?'del-only':''}">
      ${noDone ? '' : `<div class="done-strip ${completed?'is-done':''}" onclick="event.stopPropagation();toggleSlotComplete('${dateStr}','${slotKey}',${completed?'false':'true'})">${completed?'Undo':'Done'}</div>`}
      <button class="del-btn ${isLocked?'locked-del':''}" ${isLocked?"disabled title=\"Weekly Schedule goal — mark complete instead, can't be removed here\"":''} onclick="${delAction}" title="${isAbcReview?'Reschedule this ABC Review':''}">✕</button>
    </div>` : '';
  const resizeHandles = (hasContent && !isLocked) ? `
    <div class="resize-handle rh-top" onpointerdown="startResize(event,'top','${dateStr}','${slotKey}')"></div>
    <div class="resize-handle rh-bottom" onpointerdown="startResize(event,'bottom','${dateStr}','${slotKey}')"></div>` : '';
  const boxHeightPx = (span||1)*30;
  const goalWatermark = isLocked ? `<div class="goal-watermark" style="font-size:${Math.round(boxHeightPx*1.15)}px;">GOAL</div>` : '';
  if(slot && slot.critical){
    return `${resizeHandles}<div class="urgent-inner">${mainDiv}${actionsDiv}</div>`;
  }
  return resizeHandles + goalWatermark + mainDiv + actionsDiv;
}

function startResize(ev, mode, dateStr, slotKey){
  ev.stopPropagation(); ev.preventDefault();
  const d = ensureDaily(dateStr);
  const slot = d.slots[slotKey];
  if(!slot) return;
  window._resizeState = {mode, dateStr, slotKey, startY: ev.clientY, origSpan: slot.span||1};
  const line = document.createElement('div');
  line.className = 'resize-preview-line';
  line.id = 'resize-preview-line';
  line.style.top = ev.clientY+'px';
  document.body.appendChild(line);
  document.addEventListener('pointermove', onResizeMove);
  document.addEventListener('pointerup', onResizeUp, {once:true});
}
function onResizeMove(ev){
  const rs = window._resizeState;
  if(!rs) return;
  ev.preventDefault();
  rs.deltaQuarters = Math.round((ev.clientY - rs.startY)/30);
  const line = document.getElementById('resize-preview-line');
  if(line) line.style.top = ev.clientY+'px';
}
function onResizeUp(){
  document.removeEventListener('pointermove', onResizeMove);
  const line = document.getElementById('resize-preview-line');
  if(line) line.remove();
  const rs = window._resizeState;
  window._resizeState = null;
  if(!rs || !rs.deltaQuarters) return;
  applyResize(rs.dateStr, rs.slotKey, rs.mode, rs.deltaQuarters, rs.origSpan);
}
function applyResize(dateStr, slotKey, mode, deltaQuarters, origSpan){
  const d = ensureDaily(dateStr);
  const slot = d.slots[slotKey];
  if(!slot) return;
  const {h,m} = parseSlotKey(slotKey);
  const allQ = quarters();
  const startIdx = allQ.findIndex(q=>q.h===h && q.m===m);
  let newStartIdx = startIdx, newSpan = origSpan;
  if(mode==='bottom'){
    newSpan = Math.max(1, origSpan+deltaQuarters);
  } else {
    newStartIdx = Math.max(0, startIdx+deltaQuarters);
    newSpan = Math.max(1, (startIdx+origSpan)-newStartIdx);
  }
  if(newStartIdx+newSpan>allQ.length) newSpan = allQ.length-newStartIdx;
  if(newSpan<1) return;
  const oldKeys = spanKeysFrom(h, m, origSpan*15);
  const newStartQ = allQ[newStartIdx];
  const newKeys = spanKeysFrom(newStartQ.h, newStartQ.m, newSpan*15);
  for(const k of newKeys){
    if(oldKeys.includes(k)) continue;
    if(d.slots[k]){ showNotice('Cannot Resize', 'That overlaps another task.'); return; }
  }
  oldKeys.forEach(k=>{ delete d.slots[k]; });
  const newPrimary = newKeys[0];
  d.slots[newPrimary] = Object.assign({}, slot, {span:newKeys.length});
  newKeys.slice(1).forEach(k=>{ d.slots[k] = {occupiedBy:newPrimary}; });
  saveState(); renderDaily();
}

function clearSlot(ev, dateStr, slotKey){
  ev.stopPropagation();
  const d = ensureDaily(dateStr);
  Object.keys(d.slots).forEach(k=>{
    if(k===slotKey || (d.slots[k] && d.slots[k].occupiedBy===slotKey)) delete d.slots[k];
  });
  saveState(); renderDaily();
}

function toggleSlotComplete(dateStr, slotKey, val){
  const d = ensureDaily(dateStr);
  const slot = d.slots[slotKey];
  if(!slot) return;
  slot.completed = val;
  saveState();
  if(val && slot.taskId){ completeTask(slot.taskId); }
  else if(!val && slot.taskId){ uncompleteTask(slot.taskId); }
  if(slot.source==='weeklygoal' && slot.goalRef){
    const wd = ensureWeekData(weekKeyFor(dateStr));
    const g = wd.goals[slot.goalRef.i] && wd.goals[slot.goalRef.i][slot.goalRef.gk];
    if(g){ g.completed = val; g.completedDate = val ? todayISO() : null; saveState(); }
  }
  renderDaily();
}

function openSlotAssign(dateStr, slotKey){
  const d = ensureDaily(dateStr);
  const parts = slotKey.split('_');
  const h = parseInt(parts[0].slice(1));
  const m = parseInt(parts[1]);

  const usedTaskIds = new Set();
  Object.values(d.slots).forEach(s=>{
    if(!s) return;
    if(s.taskId) usedTaskIds.add(s.taskId);
    if(s.isMulti && s.subItems){ s.subItems.forEach(sub=>{ if(sub.taskId) usedTaskIds.add(sub.taskId); }); }
  });
  allGoalsEverywhere().forEach(g=>{ if(g && g.locked && g.taskId) usedTaskIds.add(g.taskId); });
  const wtConstraint = getWorkTypeConstraint(h,m);
  let eligible = state.tasks.filter(t=> !usedTaskIds.has(t.id) && (!wtConstraint || t.workType===wtConstraint || t.workType==='General'));
  const rank = {A:0,B:1,C:2,D:3};
  eligible.sort((a,b)=> rank[computePriority(a)]-rank[computePriority(b)]);

  const carryCandidates = findCarryForwardCandidates(dateStr);
  window._carryForwardCandidates = carryCandidates;
  const outlookConflicts = d.outlookConflicts || [];
  const hasReschedule = outlookConflicts.length>0 || carryCandidates.length>0;

  let html = `<div class="modal-back" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>Assign Slot — ${fmtHM(h,m)}</h2>
      <p>${wtConstraint?`Work type: <strong>${WT_LABEL[wtConstraint]}</strong> only (General tasks also allowed)`:'Open — any work type'}</p>

      ${hasReschedule ? `
      <div class="crit-section-label" style="margin-top:4px;">🔁 Reschedule — missed or conflicted</div>
      <div class="suggest-list" style="margin-bottom:10px;">
        ${outlookConflicts.map(c=>`<div class="suggest-item" style="border-left:4px solid royalblue;" onclick="assignOutlookConflictToSlot('${dateStr}','${slotKey}','${c.id}')">
          <div><div class="sname">${escHtml(c.title)}</div><div class="smeta">${c.minutes}m</div></div>
        </div>`).join('')}
        ${carryCandidates.map((c,idx)=>`<div class="suggest-item" onclick="assignCarriedToSlot('${dateStr}','${slotKey}',${idx})">
          <div><div class="sname">${escHtml(missedTaskName(c))}</div><div class="smeta">${c.time||(c.span?c.span*15:15)}m</div></div>
        </div>`).join('')}
      </div>` : ''}

      <div class="crit-section">
        <div class="crit-section-label">Critical Task</div>
        <div class="crit-entry">
          <div class="crit-icon">!</div>
          <input id="crit-name" placeholder="Enter task..."/>
          <div class="stepper" id="crit-time-stepper">
            <button class="stepper-btn" onclick="stepCritTime(-5)">▼</button>
            <input id="crit-time" type="number" value="30" step="5" min="5" readonly/>
            <button class="stepper-btn" onclick="stepCritTime(5)">▲</button>
          </div>
          <button class="btn btn-crit crit-tick" onclick="createCriticalTask('${dateStr}','${slotKey}')" title="Deploy critical task">✓</button>
        </div>
      </div>

      <div class="suggest-list">`;
  if(eligible.length===0){
    html += `<div class="empty-state">No matching unscheduled tasks in the List for this work type.</div>`;
  } else {
    eligible.slice(0,15).forEach(t=>{
      const pri = computePriority(t);
      html += `<div class="suggest-item" onclick="assignTaskToSlot('${dateStr}','${slotKey}','${t.id}')">
        <div><div class="sname">${escHtml(t.name)}</div><div class="smeta">${t.time}m ${t.multiStep?'· multi-step':''} · ${CAT_LABEL[t.category]}</div></div>
        <span class="badge badge-${pri}">${pri}</span>
      </div>`;
    });
  }
  html += `</div>
      <div class="field-row" style="display:flex;gap:8px;align-items:flex-end;">
        <div style="flex:1;"><label>Or enter custom text</label><input id="custom-slot-text" placeholder="Custom entry..."/></div>
        <div style="width:70px;"><label>Minutes</label><input id="custom-slot-time" type="number" value="15"/></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-small" onclick="closeModal()">Cancel</button>
        <button class="btn btn-small" onclick="assignCustomToSlot('${dateStr}','${slotKey}')">Assign Custom</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}

function assignOutlookConflictToSlot(dateStr, slotKey, conflictId){
  const d = ensureDaily(dateStr);
  const list = d.outlookConflicts || [];
  const idx = list.findIndex(c=>c.id===conflictId);
  if(idx===-1) return;
  const c = list[idx];
  const data = {customText:c.title, source:'outlook'};
  if(c.outlookMeeting) data.outlookMeeting = true;
  attemptAssign(dateStr, slotKey, c.minutes, data);
  // only clear from the pending list if it actually landed — attemptAssign may instead have
  // opened its own conflict-resolution modal, in which case leave this one pending
  const d2 = ensureDaily(dateStr);
  const placedSlot = d2.slots[slotKey];
  if(placedSlot && placedSlot.source==='outlook' && placedSlot.customText===c.title){
    d2.outlookConflicts = (d2.outlookConflicts||[]).filter(x=>x.id!==conflictId);
    saveState();
  }
}

function assignCarriedToSlot(dateStr, slotKey, idx){
  const candidates = window._carryForwardCandidates || [];
  const c = candidates[idx];
  if(!c) return;
  const minutes = c.time || (c.span?c.span*15:15);
  const data = c.critical ? {critical:true, name:c.name, time:minutes} : (c.taskId ? {taskId:c.taskId} : {customText:c.customText});
  attemptAssign(dateStr, slotKey, minutes, data);
  // mark the original source as resolved so it doesn't keep reappearing in future pickers
  if(c._sourceDate && c._sourceKey){
    const srcDay = ensureDaily(c._sourceDate);
    const srcSlot = srcDay.slots[c._sourceKey];
    if(srcSlot){
      if(c._sourceSubId && srcSlot.isMulti){
        const sub = srcSlot.subItems.find(s=>s.id===c._sourceSubId);
        if(sub) sub.completed = true;
      } else {
        srcSlot.completed = true;
      }
      saveState();
    }
  }
}

function writeSpanBlock(dateStr, slotKey, minutes, data){
  const d = ensureDaily(dateStr);
  const parts = slotKey.split('_');
  const h = parseInt(parts[0].slice(1));
  const m = parseInt(parts[1]);
  const keys = spanKeysFrom(h, m, minutes);
  const startKey = keys[0];
  d.slots[startKey] = Object.assign({completed:false, span:keys.length}, data);
  keys.slice(1).forEach(k=>{ d.slots[k] = {occupiedBy:startKey}; });
}

function parseSlotKey(key){
  const p = key.split('_');
  return {h:parseInt(p[0].slice(1)), m:parseInt(p[1])};
}

function checkConflict(dateStr, startKey, minutes){
  const d = ensureDaily(dateStr);
  const {h,m} = parseSlotKey(startKey);
  const keys = spanKeysFrom(h,m,minutes);
  for(let i=0;i<keys.length;i++){
    const k = keys[i];
    if(d.slots[k]){
      let conflictPrimaryKey = k;
      let conflictSlot = d.slots[k];
      if(conflictSlot.occupiedBy){ conflictPrimaryKey = conflictSlot.occupiedBy; conflictSlot = d.slots[conflictPrimaryKey]; }
      return {maxFitMinutes:i*15, conflictPrimaryKey, conflictSlot};
    }
  }
  return null;
}

function shiftBlockLater(dateStr, primaryKey, shiftMinutes){
  const d = ensureDaily(dateStr);
  const slot = d.slots[primaryKey];
  if(!slot) return false;
  const {h,m} = parseSlotKey(primaryKey);
  const duration = (slot.span||1)*15;
  const allQ = quarters();
  const oldIdx = allQ.findIndex(q=>q.h===h && q.m===m);
  const shiftQuarters = Math.round(shiftMinutes/15);
  const newIdx = oldIdx + shiftQuarters;
  const neededQuarters = Math.round(duration/15);
  if(newIdx<0 || newIdx+neededQuarters>allQ.length) return false;
  const newStart = allQ[newIdx];
  const newKeys = spanKeysFrom(newStart.h, newStart.m, duration);
  if(newKeys.length < neededQuarters) return false;
  const oldKeys = spanKeysFrom(h, m, duration);
  for(const k of newKeys){
    if(oldKeys.includes(k)) continue;
    if(d.slots[k]) return false;
  }
  oldKeys.forEach(k=>{ delete d.slots[k]; });
  const newPrimary = newKeys[0];
  d.slots[newPrimary] = Object.assign({}, slot, {span:newKeys.length});
  newKeys.slice(1).forEach(k=>{ d.slots[k] = {occupiedBy:newPrimary}; });
  return true;
}

function attemptAssign(dateStr, startKey, minutes, data){
  if(minutes < 15){
    return attemptAssignSubItem(dateStr, startKey, minutes, data);
  }
  const conflict = checkConflict(dateStr, startKey, minutes);
  if(!conflict){
    writeSpanBlock(dateStr, startKey, minutes, data);
    saveState(); closeModal(); renderDaily();
    return;
  }
  window._pendingAssign = {dateStr, startKey, minutes, data, conflict};
  showConflictModal();
}

function attemptAssignSubItem(dateStr, startKey, minutes, data){
  const d = ensureDaily(dateStr);
  const existing = d.slots[startKey];
  const usedMinutes = (existing && existing.isMulti) ? existing.subItems.reduce((sum,s)=>sum+s.duration,0) : 0;
  const hasRoom = !existing || (existing.isMulti && usedMinutes+minutes<=15);
  if(!hasRoom){
    showNotice('No Room Here', "That 15-minute slot doesn't have enough space left for a "+minutes+"-minute task. Pick an empty or partially-used slot instead.");
    return;
  }
  if(!existing){
    d.slots[startKey] = { isMulti:true, subItems:[] };
  }
  const sub = Object.assign({id:uid(), duration:minutes, completed:false}, data);
  d.slots[startKey].subItems.push(sub);
  saveState(); closeModal(); renderDaily();
}
function toggleSubItem(dateStr, slotKey, subId){
  const d = ensureDaily(dateStr);
  const slot = d.slots[slotKey];
  if(!slot || !slot.isMulti) return;
  const sub = slot.subItems.find(s=>s.id===subId);
  if(!sub) return;
  sub.completed = !sub.completed;
  if(sub.taskId && sub.completed) completeTask(sub.taskId);
  else if(sub.taskId && !sub.completed) uncompleteTask(sub.taskId);
  saveState(); renderDaily();
}
function deleteSubItem(dateStr, slotKey, subId){
  const d = ensureDaily(dateStr);
  const slot = d.slots[slotKey];
  if(!slot || !slot.isMulti) return;
  slot.subItems = slot.subItems.filter(s=>s.id!==subId);
  if(slot.subItems.length===0) delete d.slots[slotKey];
  saveState(); renderDaily();
}
function renderMultiSlot(dateStr, gridRowIdx, slotKey, slot){
  const pxPerMin = 2; // 30px row / 15 minutes
  let cursor = 0;
  let boxesHtml = '';
  slot.subItems.forEach(sub=>{
    const top = cursor*pxPerMin;
    const height = Math.max(10, sub.duration*pxPerMin);
    const task = sub.taskId ? (state.tasks.find(t=>t.id===sub.taskId) || state.archive.find(t=>t.id===sub.taskId)) : null;
    const name = sub.critical ? sub.name : (sub.taskId ? (task ? task.name : '(deleted task)') : sub.customText);
    const doneClass = sub.completed ? ' slot-done' : '';
    const priClass = task ? ' pri-'+computePriority(task) : '';
    const boxClass = sub.critical ? ' urgent-box' : priClass;
    const doneBtn = `<div class="done-strip ${sub.completed?'is-done':''}" onclick="toggleSubItem('${dateStr}','${slotKey}','${sub.id}')">${sub.completed?'Undo':'Done'}</div>`;
    const delBtn = `<button class="del-btn" onclick="deleteSubItem('${dateStr}','${slotKey}','${sub.id}')">✕</button>`;
    const nameLabel = sub.critical ? `<div class="tname" title="${escAttr(name)}">${sub.duration>15?'<span class="urgent-label">URGENT</span> ':''}${escHtml(name)} · ${sub.duration}m</div>` : `<div class="tname" title="${escAttr(name)}">${escHtml(name)} · ${sub.duration}m</div>`;
    const innerContent = `<div class="tb-main" style="cursor:default;"><div class="tb-main-row">${nameLabel}</div></div><div class="tb-actions">${doneBtn}${delBtn}</div>`;
    const content = sub.critical ? `<div class="urgent-inner">${innerContent}</div>` : innerContent;
    boxesHtml += `<div class="task-box${boxClass}${doneClass}" style="position:absolute;top:${top}px;height:${height}px;left:0;right:0;margin:0 5px;box-sizing:border-box;">${content}</div>`;
    cursor += sub.duration;
  });
  const usedMinutes = slot.subItems.reduce((sum,s)=>sum+s.duration,0);
  if(usedMinutes<15){
    const top = usedMinutes*pxPerMin;
    const height = (15-usedMinutes)*pxPerMin;
    boxesHtml += `<div class="task-box" style="position:absolute;top:${top}px;height:${height}px;left:0;right:0;margin:0 5px;box-sizing:border-box;cursor:pointer;" onclick="openSlotAssign('${dateStr}','${slotKey}')">
      <div class="empty-hint" style="font-size:9px;">+ ${15-usedMinutes}m free</div>
    </div>`;
  }
  return `<div style="grid-row:${gridRowIdx+1};grid-column:3;position:relative;height:30px;">${boxesHtml}</div>`;
}

function showConflictModal(){

  else if(cs.customText) conflictName = cs.customText;
  const overlap = minutes - conflict.maxFitMinutes;
  document.getElementById('modal-root').innerHTML = `<div class="modal-back">

}
function resolveConflictReduce(){
  const p = window._pendingAssign;

}
function resolveConflictShift(){
  const p = window._pendingAssign;
  const overlap = p.minutes - p.conflict.maxFitMinutes;
  const ok = shiftBlockLater(p.dateStr, p.conflict.conflictPrimaryKey, overlap);
  if(!ok){
    showNotice('Cannot Shift', "There isn't enough free room after the conflicting task to push it back. Try reducing your new task instead, or move things manually.");

}

/* ---- drag & drop (long-press on touch, click-drag on desktop) ---- */
function startTaskDrag(ev, dateStr, slotKey){
  if(window._dragState) return;
  const startX = ev.clientX, startY = ev.clientY;
  const ds = {dateStr, slotKey, startX, startY, dragging:false, timer:null};
  window._dragState = ds;
  ds.timer = setTimeout(()=>{
    ds.dragging = true;
    const el = ev.target.closest('.task-box');
    if(el) el.classList.add('being-dragged');
  }, 300);
  document.addEventListener('pointermove', onDragPointerMove);
  document.addEventListener('pointerup', onDragPointerUp, {once:true});
}
function onDragPointerMove(ev){
  const ds = window._dragState;
  if(!ds) return;
  if(!ds.dragging){
    const dx = Math.abs(ev.clientX-ds.startX), dy = Math.abs(ev.clientY-ds.startY);
    if(dx>12 || dy>12){
      clearTimeout(ds.timer);
      window._dragState = null;
      document.removeEventListener('pointermove', onDragPointerMove);
    }
    return;
  }
  ev.preventDefault();
  document.querySelectorAll('.drop-target-hover').forEach(el=>el.classList.remove('drop-target-hover'));
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const target = el && el.closest('[data-slotkey]');
  if(target) target.classList.add('drop-target-hover');
}
function onDragPointerUp(ev){
  document.removeEventListener('pointermove', onDragPointerMove);
  const ds = window._dragState;
  window._dragState = null;
  if(!ds) return;
  clearTimeout(ds.timer);
  document.querySelectorAll('.being-dragged').forEach(el=>el.classList.remove('being-dragged'));
  document.querySelectorAll('.drop-target-hover').forEach(el=>el.classList.remove('drop-target-hover'));
  if(!ds.dragging) return;
  window._justDragged = true;
  setTimeout(()=>{ window._justDragged = false; }, 80);
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const target = el && el.closest('[data-slotkey]');
  if(target){
    const toKey = target.getAttribute('data-slotkey');
    const toDate = target.getAttribute('data-datestr');
    if(toDate===ds.dateStr && toKey!==ds.slotKey) trySwapOrMove(ds.dateStr, ds.slotKey, toKey);
  }
}
function stripMeta(slot){
  const clone = Object.assign({}, slot);
  delete clone.completed; delete clone.span; delete clone.occupiedBy;
  return clone;
}
function totalMinToKey(totalMin){
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return 'q'+h+'_'+m;
}
function trySwapOrMove(dateStr, fromKeyRaw, toKeyRaw){
  const d = ensureDaily(dateStr);
  let fromKey = fromKeyRaw;
  let from = d.slots[fromKey];
  if(from && from.occupiedBy){ fromKey = from.occupiedBy; from = d.slots[fromKey]; }
  if(!from) return;
  if(from.source==='weeklygoal' || from.source==='default'){
    showNotice('Cannot Move', "This item is fixed by your Weekly Schedule or daily routine and can't be dragged.");
    return;
  }
  const toParts = parseSlotKey(toKeyRaw);
  const toStartTotal = toParts.h*60 + toParts.m;
  if(toKeyRaw===fromKey) return;

  const fromMinutes = (from.span||1)*15;
  const fromParts = parseSlotKey(fromKey);
  const fromSpanKeys = spanKeysFrom(fromParts.h, fromParts.m, fromMinutes);
  const DAY_END = 22*60; // matches the sheet's range (04:00–22:00)

  if(toStartTotal<4*60 || toStartTotal+fromMinutes>DAY_END){
    showNotice('Cannot Move', "That would run past the day's range. Try a different spot.");
    return;
  }

  // Take FROM off the board first so it doesn't interfere with its own cascade checks.
  const savedFrom = {};
  fromSpanKeys.forEach(k=>{ savedFrom[k]=d.slots[k]; delete d.slots[k]; });

  // Walk forward from the drop point, collecting the chain of tasks that need pushing
  // later to make room — cascading through as many as necessary.
  const pushList = []; // {key, minutes, slot, newStart}
  let cursorEnd = toStartTotal + fromMinutes;
  let safety = 0;
  let blocked = null;
  while(safety++ < 40){
    let hit = null;
    Object.keys(d.slots).forEach(k=>{
      const s = d.slots[k];
      if(!s || s.occupiedBy) return;
      const p = parseSlotKey(k);
      const st = p.h*60 + p.m;
      const en = st + ((s.span||1)*15);
      if(en>toStartTotal && st<cursorEnd){
        if(!hit || st < hit.start) hit = {key:k, start:st, slot:s};
      }
    });
    if(!hit) break; // cascade has settled, no more overlaps
    if(hit.slot.source==='weeklygoal' || hit.slot.source==='default'){
      blocked = "That would need to push a fixed block out of the way, which isn't allowed.";
      break;
    }
    const hitMinutes = (hit.slot.span||1)*15;
    const hp = parseSlotKey(hit.key);
    const hitKeys = spanKeysFrom(hp.h, hp.m, hitMinutes);
    const savedHit = {};
    hitKeys.forEach(k=>{ savedHit[k]=d.slots[k]; delete d.slots[k]; });
    pushList.push({minutes:hitMinutes, slot:hit.slot, newStart:cursorEnd, savedEntries:savedHit});
    cursorEnd = cursorEnd + hitMinutes;
  }

  if(!blocked && cursorEnd>DAY_END){
    blocked = "There isn't enough room today to push everything out of the way.";
  }

  if(blocked){
    // roll back everything exactly as it was, in reverse order
    pushList.slice().reverse().forEach(p=>{
      Object.keys(p.savedEntries).forEach(k=>{ d.slots[k]=p.savedEntries[k]; });
    });
    fromSpanKeys.forEach(k=>{ d.slots[k]=savedFrom[k]; });
    showNotice('Cannot Move', blocked+' Try a different spot, or shorten something first.');
    renderDaily();
    return;
  }

  // commit: place pushed tasks at their new (later) positions, preserving all their data
  pushList.forEach(p=>{
    const startKey = totalMinToKey(p.newStart);
    const keys = spanKeysFrom(parseSlotKey(startKey).h, parseSlotKey(startKey).m, p.minutes);
    d.slots[keys[0]] = Object.assign({}, p.slot, {span:keys.length});
    keys.slice(1).forEach(k=>{ d.slots[k] = {occupiedBy:keys[0]}; });
  });
  // place FROM at the target position, preserving all its data (completed status, id, etc.)
  const toKeys = spanKeysFrom(toParts.h, toParts.m, fromMinutes);
  d.slots[toKeys[0]] = Object.assign({}, from, {span:toKeys.length});
  toKeys.slice(1).forEach(k=>{ d.slots[k] = {occupiedBy:toKeys[0]}; });

  saveState(); renderDaily();
}
function showNotice(title, message){
  document.getElementById('modal-root').innerHTML = `<div class="modal-back" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>${escHtml(title)}</h2>
      <p>${escHtml(message)}</p>
      <div class="modal-actions"><button class="btn btn-accent btn-small" onclick="closeModal()">OK</button></div>
    </div>
  </div>`;
}

function autoFillDay(dateStr){
  const d = ensureDaily(dateStr);
  const dayIdx = new Date(dateStr+'T00:00:00').getDay();
  const usedIds = new Set();
  Object.values(d.slots).forEach(s=>{
    if(!s) return;
    if(s.taskId) usedIds.add(s.taskId);
    if(s.isMulti && s.subItems){ s.subItems.forEach(sub=>{ if(sub.taskId) usedIds.add(sub.taskId); }); }
  });
  allGoalsEverywhere().forEach(g=>{ if(g && g.locked && g.taskId) usedIds.add(g.taskId); });
  let pool = state.tasks.filter(t=>!usedIds.has(t.id));
  const today0 = new Date(); today0.setHours(0,0,0,0);
  pool.sort((a,b)=>{
    const aOverdue = a.dueDate && new Date(a.dueDate+'T00:00:00') < today0;
    const bOverdue = b.dueDate && new Date(b.dueDate+'T00:00:00') < today0;
    if(aOverdue !== bOverdue) return aOverdue ? -1 : 1;
    const pa=computePriority(a), pb=computePriority(b);
    if(PRI_RANK[pa]!==PRI_RANK[pb]) return PRI_RANK[pa]-PRI_RANK[pb];
    return new Date(a.dueDate||'2099-01-01') - new Date(b.dueDate||'2099-01-01');
  });
  const allQ = quarters();
  let placedCount = 0;
  pool.forEach(task=>{
    const needed = Math.max(1, Math.round(task.time/15));
    for(let i=0;i<allQ.length;i++){
      const startQ = allQ[i];
      if(d.slots[startQ.key]) continue;
      let ok = true;
      for(let j=0;j<needed;j++){
        const idx = i+j;
        if(idx>=allQ.length){ ok=false; break; }
        const q = allQ[idx];
        if(d.slots[q.key]){ ok=false; break; }
        const wtConstraint = getWorkTypeConstraint(q.h, q.m);
        if(wtConstraint && task.workType && task.workType!=='General' && wtConstraint!==task.workType){ ok=false; break; }
      }
      if(ok){
        writeSpanBlock(dateStr, startQ.key, task.time, {taskId:task.id});
        placedCount++;
        break;
      }
    }
  });
  saveState(); renderDaily();
  if(placedCount===0){
    showNotice('Auto Fill', 'No empty slots matched your remaining tasks by category and duration. Try widening some Weekly Orders time blocks to Open (blank), or free up more of the day.');
  }
}

   Uses the in-artifact Anthropic API + Microsoft 365 MCP connector.
   Only works while this app is open inside Claude.ai with the
   Microsoft 365 connector enabled for this chat — a standalone

const OUTLOOK_AUTO_KEYWORDS = {
  'Learning':['learning'],
  'OOS Lines / PSOs':['oos','pso'],
  'Unconfirmed':['unconfirmed'],
  'Overdue':['overdue'],
  'Meeting':['meeting','call','sync','1:1','catch up','catchup','standup','review','huddle'],
  'Purchasing run':['purchasing run','purchasing'],
  'Purchasing Inbox':['purchasing inbox'],
  'Tomorrow plan':['tomorrow plan',"tomorrow's plan",'tomorrows plan','plan for tomorrow'],
  'Plan':['plan'],
  'Lunch':['lunch'],
  'Personal Inbox':['personal inbox']
};
function isOutlookAutoCategory(ev){
  const cat = String(ev.category||'').toLowerCase();
  const title = String(ev.title||'').toLowerCase();
  for(const [bucket, kws] of Object.entries(OUTLOOK_AUTO_KEYWORDS)){
    if(kws.some(k=> cat.includes(k) || title.includes(k))) return bucket;
  }
  return null;
}

function normalizeRepoString(raw){
  let r = (raw||'').trim();
  r = r.replace(/^https?:\/\//i, ''); // strip protocol
  r = r.replace(/^github\.com\//i, ''); // strip domain if pasted as a full URL
  r = r.replace(/^\/+|\/+$/g, ''); // strip leading/trailing slashes
  r = r.replace(/\.git$/i, ''); // strip trailing .git if present
  return r;
}
function outlookSyncMode(){
  if(state.settings && state.settings.githubRepo) return 'github-file';
  if(state.settings && state.settings.msClientId) return 'graph';
  if(window.storage) return 'claude-mcp';
  return 'none';
}

async function syncOutlook(dateStr, opts){
  opts = opts || {};
  const mode = outlookSyncMode();
  if(mode==='github-file') return syncOutlookViaGithubFile(dateStr, opts);
  if(mode==='graph') return syncOutlookViaGraph(dateStr, opts);
  if(mode==='claude-mcp') return syncOutlookViaClaudeMcp(dateStr, opts);
  if(opts.hideLoadingAfter) hideLoadingProgressModal();
  if(!opts.silent){
    showNotice('Outlook Not Connected', 'Set up Outlook sync in Settings to enable calendar pull-through.');
  }
}

/* ---------------- Sync via a GitHub-hosted JSON file ----------------
   A Claude Cowork scheduled task writes tomorrow's Outlook events to
   outlook-events.json in your repo each weekday afternoon. This just
   reads that file — no OAuth, no Azure, works identically everywhere. */
async function syncOutlookViaGithubFile(dateStr, opts){
  opts = opts || {};
  if(!opts.silent) showSyncingModal();
  try{
    const repo = normalizeRepoString(state.settings.githubRepo);
    if(!repo) throw new Error('No GitHub repo set in Settings.');
    const url = `https://raw.githubusercontent.com/${repo}/main/outlook-events.json?t=${Date.now()}`;
    const resp = await fetch(url, {cache:'no-store'});
    if(!resp.ok) throw new Error('Could not fetch outlook-events.json (HTTP '+resp.status+'). Has the scheduled task run yet?');
    const raw = await resp.json();
    let events, fileDate;
    if(Array.isArray(raw)){ events = raw; fileDate = null; }
    else { events = raw.events || []; fileDate = raw.date || null; }
    if(fileDate && fileDate !== dateStr){
      if(opts.hideLoadingAfter) hideLoadingProgressModal();
      if(!opts.silent) closeModal();
      showNotice('Outlook Data Out of Date', `The GitHub file is dated ${fmtDMY(fileDate)}, not ${fmtDMY(dateStr)}. The scheduled task may not have run yet for this day — check your Cowork scheduled task.`);
      return;
    }
    processOutlookEvents(dateStr, events, opts);
  }catch(e){
    if(opts.hideLoadingAfter) hideLoadingProgressModal();
    if(!opts.silent){
      closeModal();
      showNotice('Outlook Sync Failed', "Couldn't read the calendar file from GitHub: "+e.message);
    }
  }
}

/* ---------------- Field Ledger Evening Schedule sync ----------------
   Reads field-ledger-progress.json directly from your Field Ledger repo and
   pulls that day's eveningItems (20:00–21:00) into the Daily Sitrep. Manual
   sync (not automatic) since Field Ledger's evening schedule is often filled
   in later in the day — you decide when to pull the latest version. */
const FIELD_LEDGER_SYNC_TIMES = ['12:00','14:00','16:00','18:00','20:00'];
function checkFieldLedgerScheduledSync(){
  if(!state.settings.fieldLedgerRepo) return;
  const today = todayISO();
  if(!state._fieldLedgerSyncTracker || state._fieldLedgerSyncTracker.date !== today){
    state._fieldLedgerSyncTracker = {date: today, synced: []};
  }
  const tracker = state._fieldLedgerSyncTracker;
  const now = new Date();
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const passedSlots = FIELD_LEDGER_SYNC_TIMES.filter(t=>{
    const parts = t.split(':').map(Number);
    return nowMinutes >= (parts[0]*60 + parts[1]);
  });
  const hasUnsyncedSlot = passedSlots.some(t=>!tracker.synced.includes(t));
  if(!hasUnsyncedSlot) return;
  tracker.synced = passedSlots.slice(); // one sync catches up every slot that's passed, whether the app was open for them or not
  syncFieldLedgerEvening(today, {silent:true});
}

function toggleFieldLedgerItem(dateStr, itemId){
  const d = ensureDaily(dateStr);
  const item = (d.fieldLedgerEveningItems||[]).find(i=>i.id===itemId);
  if(!item) return;
  item.completed = !item.completed;
  saveState(); renderDaily();
}
function deleteFieldLedgerItem(dateStr, itemId){
  const d = ensureDaily(dateStr);
  d.fieldLedgerEveningItems = (d.fieldLedgerEveningItems||[]).filter(i=>i.id!==itemId);
  saveState(); renderDaily();
}

async function syncFieldLedgerEvening(dateStr, opts){
  opts = opts || {};
  const repo = normalizeRepoString(state.settings.fieldLedgerRepo);
  if(!repo){
    if(!opts.silent) showNotice('Not Set Up', 'Add your Field Ledger repo in Settings first (e.g. yourname/Field-Ledger).');
    return;
  }
  try{
    const url = `https://raw.githubusercontent.com/${repo}/main/field-ledger-progress.json?t=${Date.now()}`;
    const resp = await fetch(url, {cache:'no-store'});
    if(!resp.ok) throw new Error('Could not fetch Field Ledger data (HTTP '+resp.status+').');
    const data = await resp.json();
    const dayEntry = data.days && data.days[dateStr];
    const items = (dayEntry && dayEntry.eveningItems) || [];
    const d = ensureDaily(dateStr);
    // clear any previously-synced Field Ledger items for this day first, so re-syncing replaces rather than duplicates
    // preserve completed-status across re-syncs by matching on text + startMin where possible
    const prevItems = d.fieldLedgerEveningItems || [];
    const prevByKey = {};
    prevItems.forEach(p=>{ prevByKey[p.startMin+'|'+p.text] = p; });
    const sorted = items.slice().sort((a,b)=>(a.start||0)-(b.start||0));
    d.fieldLedgerEveningItems = sorted.map(item=>{
      const startMin = item.start||0;
      const text = item.text||'(untitled)';
      const prev = prevByKey[startMin+'|'+text];
      return { id: uid(), startMin, duration: Math.max(5, item.duration||5), text, completed: prev ? !!prev.completed : false };
    });
    const added = d.fieldLedgerEveningItems.length;
    saveState(); renderDaily();
    if(!opts.silent) showToast(added+' evening item(s) synced from Field Ledger');
  }catch(e){
    if(!opts.silent) showNotice('Sync Failed', "Couldn't read Field Ledger data: "+e.message);
    else console.error('Field Ledger sync failed silently:', e.message);
  }
}

/* ---------------- Direct Microsoft Graph sync (works standalone, e.g. on GitHub Pages) ----------------
   Uses Microsoft's own MSAL.js library to sign in from the browser and read
   the user's calendar directly via Microsoft Graph — no backend, no Anthropic
   API involved. Requires a one-time Azure App Registration (see Settings). */
let _msalInstance = null;
function ensureMsalLoaded(){
  return new Promise((resolve, reject)=>{
    if(window.msal){ resolve(window.msal); return; }
    const script = document.createElement('script');
    script.src = 'https://alcdn.msauth.net/browser/3.7.1/js/msal-browser.min.js';
    script.onload = ()=>resolve(window.msal);
    script.onerror = ()=>reject(new Error('Could not load the Microsoft sign-in library.'));
    document.head.appendChild(script);
  });
}
function getMsalInstance(){
  if(_msalInstance) return _msalInstance;
  if(!state.settings.msClientId) throw new Error('No Microsoft Client ID set in Settings.');
  _msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: state.settings.msClientId,
      authority: 'https://login.microsoftonline.com/common',
      redirectUri: window.location.origin + window.location.pathname
    },
    cache: { cacheLocation: 'localStorage' }
  });
  return _msalInstance;
}
async function connectOutlookGraph(){
  try{
    await ensureMsalLoaded();
    const instance = getMsalInstance();
    const resp = await instance.loginPopup({scopes:['Calendars.Read']});
    instance.setActiveAccount(resp.account);
    saveState();
    closeModal(); openSettingsModal();
    showToast('Connected to Outlook');
  }catch(e){
    showNotice('Connection Failed', e.message);
  }
}
function disconnectOutlookGraph(){
  if(_msalInstance){
    const account = _msalInstance.getActiveAccount();
    if(account) _msalInstance.logoutPopup({account}).catch(()=>{});
  }
  _msalInstance = null;
  closeModal(); openSettingsModal();
}
function isOutlookGraphConnected(){
  try{
    if(!state.settings.msClientId || !window.msal) return false;
    const instance = getMsalInstance();
    return instance.getAllAccounts().length > 0;
  }catch(e){ return false; }
}
async function acquireGraphToken(){
  await ensureMsalLoaded();
  const instance = getMsalInstance();
  let account = instance.getActiveAccount();
  if(!account){
    const accounts = instance.getAllAccounts();
    if(accounts.length>0){ account = accounts[0]; instance.setActiveAccount(account); }
  }
  if(!account){
    const resp = await instance.loginPopup({scopes:['Calendars.Read']});
    instance.setActiveAccount(resp.account);
    account = resp.account;
  }
  try{
    const resp = await instance.acquireTokenSilent({scopes:['Calendars.Read'], account});
    return resp.accessToken;
  }catch(e){
    const resp = await instance.acquireTokenPopup({scopes:['Calendars.Read']});
    return resp.accessToken;
  }
}
async function fetchGraphEvents(dateStr){
  const token = await acquireGraphToken();
  const start = dateStr+'T00:00:00';
  const endD = new Date(dateStr+'T00:00:00'); endD.setDate(endD.getDate()+1);
  const end = endD.getFullYear()+'-'+String(endD.getMonth()+1).padStart(2,'0')+'-'+String(endD.getDate()).padStart(2,'0')+'T00:00:00';
  const url = `https://graph.microsoft.com/v1.0/me/calendarView?startDateTime=${start}&endDateTime=${end}&$select=subject,start,end&$orderby=start/dateTime`;
  const resp = await fetch(url, { headers: { Authorization: 'Bearer '+token, Prefer: 'outlook.timezone="UTC"' } });
  if(!resp.ok) throw new Error('Microsoft Graph returned an error (HTTP '+resp.status+').');
  const data = await resp.json();
  return (data.value||[]).map(ev=>{
    const s = new Date(ev.start.dateTime+'Z');
    const e = new Date(ev.end.dateTime+'Z');
    return {
      title: ev.subject || '(no title)',
      start: String(s.getHours()).padStart(2,'0')+':'+String(s.getMinutes()).padStart(2,'0'),
      end: String(e.getHours()).padStart(2,'0')+':'+String(e.getMinutes()).padStart(2,'0'),
      category: ''
    };
  });
}
async function syncOutlookViaGraph(dateStr, opts){
  opts = opts || {};
  if(!opts.silent) showSyncingModal();
  try{
    const events = await fetchGraphEvents(dateStr);
    processOutlookEvents(dateStr, events, opts);
  }catch(e){
    if(opts.hideLoadingAfter) hideLoadingProgressModal();
    if(!opts.silent){
      closeModal();
      showNotice('Outlook Sync Failed', "Couldn't reach Outlook: "+e.message+' Try reconnecting in Settings.');
    }
  }
}

async function syncOutlookViaClaudeMcp(dateStr, opts){
  opts = opts || {};
  if(!opts.silent) showSyncingModal();
  const prompt = `You have access to the user's Outlook calendar via Microsoft 365 tools. Look up all calendar events for ${dateStr} (YYYY-MM-DD). For each event, classify it into exactly one of these categories based on its title/context: "Learning", "OOS Lines / PSOs", "Unconfirmed", "Overdue", "Meeting" (any meeting invite), "Purchasing run", "Purchasing Inbox", "Tomorrow plan", "Lunch", "Personal Inbox", or "Other" if none clearly match. Respond with ONLY a raw JSON array, no markdown fences, no commentary: [{"title":string,"start":"HH:MM" (24hr),"end":"HH:MM" (24hr),"category":string}]. If there are no events, respond with [].`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{role:"user", content: prompt}],
        mcp_servers: [{type:"url", url:"https://microsoft365.mcp.claude.com/mcp", name:"microsoft365"}]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const clean = textBlocks.replace(/```json|```/g,'').trim();
    let events = [];
    try{ events = JSON.parse(clean); }
    catch(e){
      if(opts.hideLoadingAfter) hideLoadingProgressModal();
      if(!opts.silent){
        closeModal();
        showNotice("Outlook Sync", "Couldn't read a clean response from Outlook sync. Make sure the Microsoft 365 connector is enabled for this chat (Settings > Connectors), and note this only works while the app is open inside Claude.ai.");
      }
      return;
    }
    processOutlookEvents(dateStr, events, opts);
  }catch(e){
    if(opts.hideLoadingAfter) hideLoadingProgressModal();
    if(!opts.silent){
      closeModal();
      showNotice("Outlook Sync Failed", "Outlook sync failed: "+e.message+". This only works while the app is open inside Claude.ai with Microsoft 365 connected — it can't reach Outlook from a standalone downloaded file.");
    }
  }
}

function showLoadingProgressModal(title){
  const estimatedMs = 8000; // expected total sync time — bar moves at a constant pace toward this
  const startTime = Date.now();
  window._loadingModalActive = true;
  document.getElementById('modal-root').innerHTML = `<div class="modal-back">
    <div class="modal" style="text-align:center;">
      <h2>${escHtml(title||'Loading')}</h2>
      <div id="loading-donut-holder">${renderDonut(0,'var(--cyan)','Syncing',null,true)}</div>
      <p class="assumption-note">Pulling Outlook calendar events and Weekly Schedule goals...</p>
    </div>
  </div>`;
  clearInterval(window._loadingAnimInterval);
  clearTimeout(window._loadingSafetyTimeout);
  window._loadingAnimInterval = setInterval(()=>{
    const elapsed = Date.now() - startTime;
    const pct = Math.min(92, (elapsed/estimatedMs)*92);
    const holder = document.getElementById('loading-donut-holder');
    if(holder) holder.innerHTML = renderDonut(Math.round(pct), 'var(--cyan)', 'Syncing', null, true);
    else clearInterval(window._loadingAnimInterval);
  }, 100);
  // safety net: if the sync call hangs or never calls back for any reason (slow network,
  // connector not available, etc.), force the bar to finish rather than leaving it stuck
  window._loadingSafetyTimeout = setTimeout(()=>{
    if(window._loadingModalActive) hideLoadingProgressModal();
  }, 12000);
}
function hideLoadingProgressModal(){
  window._loadingModalActive = false;
  clearTimeout(window._loadingSafetyTimeout);
  clearInterval(window._loadingAnimInterval);
  const holder = document.getElementById('loading-donut-holder');
  if(!holder) return; // modal-root has already been taken over by something else — don't touch it
  let current = 92;
  const finishInterval = setInterval(()=>{
    const h = document.getElementById('loading-donut-holder');
    if(!h){ clearInterval(finishInterval); return; } // bail if something else replaced the modal mid-animation
    current = Math.min(100, current+2);
    h.innerHTML = renderDonut(current, 'var(--cyan)', current>=100?'Done!':'Syncing', null, true);
    if(current>=100){
      clearInterval(finishInterval);
      setTimeout(()=>{
        const stillThere = document.getElementById('loading-donut-holder');
        if(stillThere) closeModal(); // only close if we're still the modal on screen
      }, 450);
    }
  }, 30);
}

function showSyncingModal(){
  document.getElementById('modal-root').innerHTML = `<div class="modal-back"><div class="modal"><h2>📅 Syncing Outlook…</h2><p>Reading your calendar and matching recurring items. This can take a few seconds.</p></div></div>`;
}

function processOutlookEvents(dateStr, events, opts){
  opts = opts || {};
  const d = ensureDaily(dateStr);
  let autoAdded = 0;
  const flagged = [];
  const conflicted = [];
  (events||[]).forEach(ev=>{
    if(!ev || !ev.title || !ev.start) return;
    const matchedBucket = isOutlookAutoCategory(ev);
    const isAuto = !!matchedBucket;
    const parts0 = ev.start.split(':').map(Number);
    const sh=parts0[0], sm=parts0[1]||0;
    let minutes = 30;
    if(ev.end){
      const parts1 = ev.end.split(':').map(Number);
      minutes = Math.max(15, (parts1[0]*60+(parts1[1]||0)) - (sh*60+sm));
    }
    let snapM = Math.round(sm/15)*15, snapH = sh;
    if(snapM===60){ snapM=0; snapH++; }
    if(snapH<4 || snapH>21){ if(!isAuto) flagged.push(ev); return; }
    if(isAuto){
      const key = 'q'+snapH+'_'+snapM;
      if(!d.slots[key]){
        const data = {customText: ev.title, source:'outlook'};
        if(matchedBucket==='Meeting') data.outlookMeeting = true;
        writeSpanBlock(dateStr, key, minutes, data);
        autoAdded++;
      } else {
        // slot's already occupied (most likely a weekly goal) — don't silently drop this event
        conflicted.push({title:ev.title, start:ev.start, end:ev.end, existingName: missedTaskName(d.slots[key])});
        if(!d.outlookConflicts) d.outlookConflicts = [];
        d.outlookConflicts.push({id:uid(), title:ev.title, minutes, outlookMeeting: matchedBucket==='Meeting'});
      }
    } else {
      flagged.push(ev);
    }
  });
  saveState();
  if(opts.hideLoadingAfter) hideLoadingProgressModal();
  window._outlookConflicted = conflicted;
  if(flagged.length>0){
    showFlaggedEventsModal(dateStr, flagged, autoAdded);
  } else if(conflicted.length>0){
    showOutlookConflictModal(conflicted, autoAdded);
  } else {
    if(!opts.silent){ closeModal(); showNotice('Outlook Sync', autoAdded+' item(s) auto-scheduled from Outlook.'); }
    renderDaily();
  }
}
function showOutlookConflictModal(conflicted, autoAdded){
  let html = `<div class="modal-back"><div class="modal">
    <h2>⚠ Outlook Items Couldn't Be Placed</h2>
    <p>${autoAdded} item(s) auto-scheduled. But these clash with something already on your calendar (most likely a Weekly Schedule goal) and weren't added. No action needed from you here — just be aware you'll need to place these yourself via "Click to Assign" on whichever slot suits:</p>
    <div class="suggest-list">
      ${conflicted.map(c=>`<div class="flag-item">
        <div><div class="fname">"${escHtml(c.title)}" at ${escHtml(c.start||'')}${c.end?'–'+escHtml(c.end):''}</div>
        <div class="fmeta">Clashes with: ${escHtml(c.existingName)}</div></div>
      </div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-accent" onclick="closeModal();renderDaily();">Understood</button></div>
  </div></div>`;
  document.getElementById('modal-root').innerHTML = html;
}
function proceedAfterFlaggedEvents(){
  const conflicted = window._outlookConflicted || [];
  if(conflicted.length>0){
    showOutlookConflictModal(conflicted, 0);
  } else {
    closeModal(); renderDaily();
  }
}
function showFlaggedEventsModal(dateStr, flagged, autoAdded){
  window._flaggedEvents = flagged;
  let html = `<div class="modal-back">
    <div class="modal">
      <h2>Other Calendar Items</h2>
      <p>${autoAdded} recurring item(s) auto-scheduled. These others don't match your auto-schedule list — want them added too?</p>
      <div class="suggest-list">`;
  flagged.forEach((ev,i)=>{
    html += `<div class="flag-item">
      <div><div class="fname">You have "${escHtml(ev.title)}" at ${escHtml(ev.start||'')}${ev.end?'–'+escHtml(ev.end):''}</div><div class="fmeta">${escHtml(ev.category||'Other')} — schedule it in?</div></div>
      <div class="fbtns">
        <button class="btn btn-small btn-accent" onclick="addFlaggedEvent('${dateStr}',${i});removeFlagItemAndCheck(this);">Yes</button>
        <button class="btn btn-small btn-ghost" onclick="removeFlagItemAndCheck(this)">No</button>
      </div>
    </div>`;
  });
  html += `</div>
      <div class="modal-actions"><button class="btn" onclick="proceedAfterFlaggedEvents();">Done</button></div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}

function removeFlagItemAndCheck(btn){
  const item = btn.closest('.flag-item');
  const list = btn.closest('.suggest-list');
  if(item) item.remove();
  if(list && list.querySelectorAll('.flag-item').length===0){
    proceedAfterFlaggedEvents();
  }
}
function addFlaggedEvent(dateStr, i){
  const ev = window._flaggedEvents[i];
  if(!ev) return;
  const parts0 = ev.start.split(':').map(Number);
  const sh=parts0[0], sm=parts0[1]||0;
  let minutes=30;
  if(ev.end){ const parts1=ev.end.split(':').map(Number); minutes=Math.max(15,(parts1[0]*60+(parts1[1]||0))-(sh*60+sm)); }
  let snapM = Math.round(sm/15)*15, snapH=sh;
  if(snapM===60){ snapM=0; snapH++; }
  if(snapH>=4 && snapH<=21){
    const d = ensureDaily(dateStr);
    const key = 'q'+snapH+'_'+snapM;
    if(!d.slots[key]){
      const isMeeting = /meeting|call|sync|1:1|catch up|catchup|standup|review|huddle/i.test(ev.title||'') || /meeting/i.test(ev.category||'');
      writeSpanBlock(dateStr, key, minutes, {customText: ev.title, source:'outlook', outlookMeeting: isMeeting});
      saveState();
    }
  }
}

      : `<span class="editable-cell" title="Click to edit" onclick="startInlineEdit('${t.id}','time')">${t.time}m</span>`;
    const dueCell = editingThis('dueDate')
      ? `<input autofocus type="date" value="${t.dueDate||''}" onchange="saveInlineEdit('${t.id}','dueDate',this.value)" onblur="cancelInlineEditBlur()"/>`
      : `<span class="editable-cell" title="Click to edit" onclick="startInlineEdit('${t.id}','dueDate')">${fmtDMY(t.dueDate)}${overdue?' (OVERDUE)':''}</span>`;
    html += `<tr>
      <td><span class="badge badge-${pri}">${pri}</span></td>
      <td class="task-name-cell">${escHtml(t.name)}${t.multiStep?' <span class="multi-icon" title="Multi-step">⟳</span>':''}</td>
      <td>${catCell}</td>
      <td>${wtCell}</td>
      <td>${timeCell}</td>
      <td class="${overdue?'due-soon':''}">${dueCell}</td>
      <td>
        <div class="row-actions">
          <div class="done-box" onclick="completeTask('${t.id}')">Done</div>
          <div class="edit-icon" title="Edit task" onclick="openEditTaskModal('${t.id}')">✎</div>
          <div class="del-strip" title="Delete permanently" onclick="confirmDeleteTask('${t.id}')">✕</div>
        </div>
      </td>
    </tr>`;
  });
  html += `</table></div>`;
  const hadFocus = document.activeElement && document.activeElement.id==='task-search-input';
  const caretPos = hadFocus ? document.activeElement.selectionStart : null;
  panel.innerHTML = html;
  if(hadFocus){
    const el = document.getElementById('task-search-input');

function startInlineEdit(id, field){

function cancelInlineEditBlur(){

function saveInlineEdit(id, field, value){
  const t = state.tasks.find(x=>x.id===id);
  if(!t){ state._inlineEdit=null; renderRoster(); return; }
  if(field==='category') t.category = value;
  else if(field==='workType') t.workType = value;
  else if(field==='time') t.time = parseInt(value)||t.time;
  else if(field==='dueDate'){
    const due = value || null;
    const v = validatePriorityDate(t.priority, due);
    if(!v.ok){
      state._inlineEdit = null;
      window._pendingTaskEdit = {id:t.id, name:t.name, cat:t.category, wt:t.workType, pri:t.priority, time:t.time, due, multi:t.multiStep};
      showPriorityDateConflictModal(v, 'edit');
      return;
    }
    t.dueDate = due;
  }
  state._inlineEdit = null;
  saveState(); renderRoster();
}

function matchCategoryInput(val){
  if(!val) return null;
  const v = String(val).trim().toLowerCase();
  if(!v) return null;
  for(const c of CATS){ if(c.toLowerCase()===v || CAT_LABEL[c].toLowerCase()===v) return c; }
  return null;
}
function matchWorkTypeInput(val){
  if(!val) return null;
  const v = String(val).trim().toLowerCase();
  if(!v) return null;
  for(const wt of WORK_TYPES){ if(wt.toLowerCase()===v || WT_LABEL[wt].toLowerCase()===v) return wt; }
  return null;
}
function matchPriorityInput(val){
  if(!val) return null;
  const v = String(val).trim().toUpperCase();
  if(['A','B','C','D'].includes(v)) return v;
  return null;
}
function findHeaderKey(headers, candidates){
  for(const h of headers){
    const norm = h.trim().toLowerCase().replace(/[\s_]+/g,'');
    if(candidates.includes(norm)) return h;
  }
  return null;
}
function rowsToTasks(rows){
  // rows: array of plain objects keyed by whatever header text was in the file
  if(rows.length===0) return 0;
  const headers = Object.keys(rows[0]);
  const nameKey = findHeaderKey(headers, ['name','taskname','task']);
  const catKey = findHeaderKey(headers, ['category','rolecategory','role']);
  const wtKey = findHeaderKey(headers, ['worktype','work']);
  const priKey = findHeaderKey(headers, ['priority']);
  const timeKey = findHeaderKey(headers, ['time','minutes','timeneeded']);
  let count = 0;
  rows.forEach(row=>{
    const name = nameKey ? String(row[nameKey]||'').trim() : '';
    if(!name) return;
    const cat = (catKey && matchCategoryInput(row[catKey])) || 'Self';
    const wt = (wtKey && matchWorkTypeInput(row[wtKey])) || 'Hack';
    const pri = (priKey && matchPriorityInput(row[priKey])) || 'D';
    const time = (timeKey && parseInt(row[timeKey])) || 30;
    const due = computeDueDateFromOffset(new Date(), priorityDueOffset(pri));
    state.tasks.push({ id:uid(), name, category:cat, workType:wt, time, multiStep:false, dueDate:due, priority:pri, created:todayISO() });
    count++;
  });
  return count;
}
function parseCsvText(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length===0) return [];
  const headers = lines[0].split(',').map(h=>h.trim());
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const cells = lines[i].split(',').map(c=>c.trim());
    const obj = {};
    headers.forEach((h,idx)=>{ obj[h] = cells[idx]!==undefined ? cells[idx] : ''; });
    rows.push(obj);
  }
  return rows;
}
function ensureXlsxLoaded(){
  return new Promise((resolve,reject)=>{
    if(window.XLSX){ resolve(window.XLSX); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = ()=>resolve(window.XLSX);
    script.onerror = ()=>reject(new Error('Could not load the Excel-reading library.'));
    document.head.appendChild(script);
  });
}
function doBulkImportTasks(){
  const fileInput = document.getElementById('import-file-input');
  const file = fileInput && fileInput.files[0];
  if(!file){ showNotice('No File Selected', 'Choose a file first.'); return; }
  const isXlsx = /\.xlsx$/i.test(file.name);
  if(isXlsx){
    ensureXlsxLoaded().then(XLSX=>{
      const reader = new FileReader();
      reader.onload = function(e){
        try{
          const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
          const count = rowsToTasks(rows);
          saveState(); closeModal(); renderRoster();
          showToast(count+' task(s) imported');
        }catch(err){ showNotice('Import Failed', 'Could not read that spreadsheet: '+err.message); }
      };
      reader.onerror = function(){ showNotice('Import Failed', 'Could not read that file.'); };
      reader.readAsArrayBuffer(file);
    }).catch(err=>showNotice('Import Failed', err.message));
  } else {
    const reader = new FileReader();
    reader.onload = function(e){
      const rows = parseCsvText(String(e.target.result||''));
      const count = rowsToTasks(rows);
      saveState(); closeModal(); renderRoster();
      showToast(count+' task(s) imported');
    };
    reader.onerror = function(){ showNotice('Import Failed', 'Could not read that file.'); };
    reader.readAsText(file);
  }
}

function uncompleteTask(id){
  const idx = state.archive.findIndex(t=>t.id===id);
  if(idx===-1) return;
  const task = state.archive[idx];
  delete task.completedDate;
  state.archive.splice(idx,1);
  state.tasks.push(task);
  Object.values(state.daily).forEach(d=>{
    Object.values(d.slots||{}).forEach(s=>{ if(s.taskId===id) s.completed=false; });
    Object.values(d.slots||{}).forEach(s=>{
      if(s.isMulti && s.subItems){ s.subItems.forEach(sub=>{ if(sub.taskId===id) sub.completed=false; }); }
    });
  });
  saveState();
}

function completeTask(id){
  const idx = state.tasks.findIndex(t=>t.id===id);
  if(idx===-1) return;
  const task = state.tasks[idx];
  task.completedDate = todayISO();
  state.archive.push(task);
  state.tasks.splice(idx,1);
  Object.values(state.daily).forEach(d=>{
    Object.values(d.slots||{}).forEach(s=>{ if(s.taskId===id) s.completed=true; });
  });
  saveState();
  if(task.multiStep){ setTimeout(()=>promptFollowUp(task), 50); }
  renderAll();
}
